<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创角选角界面原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-emerald-900 to-slate-900 text-white min-h-screen max-w-sm mx-auto flex flex-col">
  <!-- 顶部：标题 + 返回 -->
  <header class="flex items-center justify-between p-3">
    <button class="w-8 h-8 rounded-full bg-white/10">‹</button>
    <span class="font-bold tracking-wide">选择你的球星</span>
    <span class="w-8"></span>
  </header>

  <!-- 主体：当前角色大图 + 战力 -->
  <main class="flex-1 flex flex-col items-center justify-center relative">
    <div class="w-48 h-64 bg-white/10 rounded-2xl flex items-center justify-center text-white/40">角色 3D 立绘</div>
    <div class="mt-3 px-4 py-1 rounded-full bg-amber-400 text-slate-900 text-sm font-bold">战力 1280</div>
  </main>

  <!-- 4 个角色切换 -->
  <div class="flex justify-center gap-3 px-4">
    <div class="w-14 h-14 rounded-xl bg-white/20 ring-2 ring-amber-400 flex items-center justify-center text-xs">角色1</div>
    <div class="w-14 h-14 rounded-xl bg-white/10 flex items-center justify-center text-xs">角色2</div>
    <div class="w-14 h-14 rounded-xl bg-white/10 flex items-center justify-center text-xs">角色3</div>
    <div class="w-14 h-14 rounded-xl bg-white/10 flex items-center justify-center text-xs">角色4</div>
  </div>

  <!-- 底部：确定 -> 触发国籍弹窗 -->
  <footer class="p-4">
    <button class="w-full py-3 rounded-xl bg-amber-400 text-slate-900 font-bold text-lg">确定</button>
  </footer>

  <!-- 国籍选择弹窗（点确定后弹出） -->
  <div class="absolute inset-0 bg-black/60 flex items-end">
    <div class="w-full bg-slate-800 rounded-t-3xl p-5">
      <h3 class="font-bold mb-1">选择国籍</h3>
      <p class="text-xs text-white/50 mb-4">国籍将决定首次签约时可选的球队（可随时返回重选）</p>
      <div class="grid grid-cols-3 gap-3 mb-5">
        <button class="py-3 rounded-lg bg-white/10">🇧🇷 巴西</button>
        <button class="py-3 rounded-lg bg-white/10">🇦🇷 阿根廷</button>
        <button class="py-3 rounded-lg bg-white/10">🇫🇷 法国</button>
        <button class="py-3 rounded-lg bg-white/10">🇪🇸 西班牙</button>
        <button class="py-3 rounded-lg bg-white/10">🇩🇪 德国</button>
        <button class="py-3 rounded-lg bg-white/10">…</button>
      </div>
      <button class="w-full py-3 rounded-xl bg-emerald-500 font-bold">进入试训</button>
    </div>
  </div>
</body>
</html>
