<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赛前对阵原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen max-w-sm mx-auto flex flex-col"
      style="background:linear-gradient(#5aa0d8,#3a7d3a);">
  <!-- 顶部资源栏 + 轮次 -->
  <header class="flex items-center gap-1 p-2 text-xs bg-black/30">
    <span class="bg-black/30 rounded px-2 py-0.5">💎 1342</span>
    <span class="bg-black/30 rounded px-2 py-0.5">🟡 1342</span>
    <span class="bg-black/30 rounded px-2 py-0.5">⚡ 9/9</span>
    <span class="ml-auto text-white/80">ESP-L3 · 第 13/19 轮</span>
  </header>

  <!-- 对阵双方 -->
  <main class="flex-1 flex flex-col">
    <div class="flex items-stretch px-3 pt-4">
      <!-- 主队 -->
      <div class="flex-1 text-center">
        <div class="text-sm font-bold">MADRID C.</div>
        <div class="text-xs text-amber-300">★★ · 第1名</div>
        <img src="../../input/refs/team_a.png" alt="主队立绘位"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'h-28 mt-2 rounded-lg bg-white/15 flex items-center justify-center text-white/50 text-[10px]',innerText:'主队立绘位'}))"
             class="h-28 mt-2 mx-auto">
      </div>
      <div class="flex items-center text-2xl font-black text-white/80">VS</div>
      <!-- 客队 -->
      <div class="flex-1 text-center">
        <div class="text-sm font-bold">LINARES DEP.</div>
        <div class="text-xs text-white/60">★★ · 第20名</div>
        <img src="../../input/refs/team_b.png" alt="客队立绘位"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'h-28 mt-2 rounded-lg bg-white/15 flex items-center justify-center text-white/50 text-[10px]',innerText:'客队立绘位'}))"
             class="h-28 mt-2 mx-auto">
      </div>
    </div>

    <!-- 三项数据卡（对应胜平负阈值/切片数） -->
    <div class="grid grid-cols-3 gap-2 px-3 mt-4 text-center text-xs">
      <div class="bg-black/30 rounded-lg py-2"><div class="text-lg font-bold">3</div>射门机会 ⓘ<div class="text-[9px] text-white/50">=切片数</div></div>
      <div class="bg-black/30 rounded-lg py-2"><div class="text-lg font-bold text-emerald-300">2</div>胜利 ⓘ<div class="text-[9px] text-white/50">win_threshold</div></div>
      <div class="bg-black/30 rounded-lg py-2"><div class="text-lg font-bold text-amber-300">1</div>平 ⓘ<div class="text-[9px] text-white/50">draw_threshold</div></div>
    </div>

    <!-- 道具槽（携带局内道具） -->
    <div class="flex justify-center gap-3 mt-4">
      <button class="w-14 h-14 rounded-xl bg-black/30 border border-dashed border-white/30 flex flex-col items-center justify-center text-[10px]">＋<span>哨子</span></button>
      <button class="w-14 h-14 rounded-xl bg-black/30 border border-dashed border-white/30 flex flex-col items-center justify-center text-[10px]">＋<span>回溯</span></button>
      <button class="w-14 h-14 rounded-xl bg-black/30 border border-dashed border-white/30 flex flex-col items-center justify-center text-[10px]">＋<span>瞄准</span></button>
    </div>

    <!-- 积分榜 / 赛程入口 -->
    <div class="grid grid-cols-2 gap-2 px-3 mt-4 text-sm">
      <button class="py-2 rounded-lg bg-white/10">📊 积分榜</button>
      <button class="py-2 rounded-lg bg-white/10">📅 赛程</button>
    </div>
  </main>

  <!-- 底部：返回 / 开球 -->
  <footer class="grid grid-cols-3 gap-2 p-3 bg-black/40">
    <button class="py-3 rounded-xl bg-white/10 text-sm">← 返回</button>
    <button class="col-span-2 py-3 rounded-xl bg-amber-400 text-slate-900 font-bold">开球 ⚡1</button>
  </footer>
</body>
</html>
