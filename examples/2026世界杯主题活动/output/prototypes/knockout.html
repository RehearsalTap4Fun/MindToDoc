<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>淘汰赛对阵界面原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen max-w-sm mx-auto flex flex-col">
  <header class="p-3 bg-slate-800 flex justify-between items-center">
    <span class="font-bold">淘汰赛 · 8强</span>
    <span class="text-xs text-amber-300">结算倒计时 02:14:30</span>
  </header>
  <div class="flex justify-around text-xs py-2 bg-slate-800/50">
    <span class="text-white/40">组队期 ✓</span>
    <span class="text-white/40">匹配期 ✓</span>
    <span class="text-amber-300 font-bold">比赛期 ●</span>
  </div>
  <main class="flex-1 p-4 space-y-4">
    <div class="text-xs text-white/50">本轮对阵（同时结算）</div>
    <div class="bg-white/5 rounded-xl p-3">
      <div class="flex justify-between items-center mb-2">
        <span class="font-bold text-emerald-300">我的球队·烈焰</span>
        <span class="text-xs text-white/50">总评 4820 · 最高 1320</span>
      </div>
      <div class="text-center text-white/40 text-xs my-1">VS</div>
      <div class="flex justify-between items-center">
        <span>对手·苍狼</span>
        <span class="text-xs text-white/50">总评 4510 · 最高 1280</span>
      </div>
    </div>
    <div class="bg-emerald-600/20 rounded-xl p-4 text-center">
      <div class="text-2xl font-black text-emerald-300">已晋级</div>
      <div class="text-sm text-white/60 mt-1">模拟比分 3 : 1</div>
      <button class="mt-3 px-4 py-2 rounded-lg bg-white/10 text-sm">▶ 观看模拟回放</button>
      <button class="mt-2 px-4 py-2 rounded-lg bg-white/10 text-sm w-full">查看赛后简报</button>
    </div>
  </main>
  <footer class="p-3 bg-slate-800 text-center text-xs text-white/50">
    名次奖励：外观 + 道具 · 比赛开放竞猜
  </footer>
</body>
</html>
