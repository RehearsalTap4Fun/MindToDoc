<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赛季关卡地图原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen max-w-sm mx-auto flex flex-col"
      style="background:linear-gradient(#5aa0d8,#3a7d3a);">
  <!-- 顶部：联赛 + 球队标 -->
  <header class="flex justify-between items-center p-3 bg-black/30">
    <div>
      <div class="font-bold text-sm">ESP-L3 · Madrid C.</div>
      <div class="text-xs text-white/60">第 2 赛季联赛 · 顺序解锁</div>
    </div>
    <span class="text-xs bg-black/30 rounded px-2 py-1">🎫 5/10</span>
  </header>

  <!-- 关卡路径地图（节点沿曲线，已过/当前/未解锁） -->
  <main class="flex-1 relative overflow-hidden">
    <!-- 连线 -->
    <svg class="absolute inset-0 w-full h-full" preserveAspectRatio="none" viewBox="0 0 300 460">
      <polyline points="60,420 230,360 80,300 240,240 90,180 250,120 110,60"
                fill="none" stroke="white" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="6 6"/>
    </svg>
    <!-- 节点：style left/top 百分比定位 -->
    <!-- 已通关 -->
    <div class="absolute" style="left:14%;top:88%"><div class="w-9 h-9 rounded-full bg-emerald-500 flex items-center justify-center text-xs font-bold">✓</div><div class="text-[9px] text-center">2018</div></div>
    <div class="absolute" style="left:72%;top:76%"><div class="w-9 h-9 rounded-full bg-emerald-500 flex items-center justify-center text-xs font-bold">✓</div><div class="text-[9px] text-center">2019</div></div>
    <!-- 当前关 + 角色立绘 -->
    <div class="absolute" style="left:22%;top:60%">
      <span class="block text-[9px] text-center text-amber-200 font-bold mb-0.5">ESP-L3 / Madrid C.</span>
      <img src="../../input/refs/character.png" alt="角色立绘位"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'w-12 h-20 mx-auto rounded-lg bg-white/20 flex items-center justify-center text-white/50 text-[9px]',innerText:'角色位'}))"
           class="h-20 mx-auto">
      <div class="w-10 h-10 mx-auto -mt-1 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center text-sm font-bold ring-4 ring-amber-200">3</div>
    </div>
    <!-- 未解锁 -->
    <div class="absolute opacity-60" style="left:78%;top:48%"><div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-xs">🔒</div><div class="text-[9px] text-center">2020</div></div>
    <div class="absolute opacity-60" style="left:26%;top:36%"><div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-xs">🔒</div><div class="text-[9px] text-center">2021</div></div>
    <div class="absolute opacity-60" style="left:80%;top:24%"><div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-xs">🔒</div><div class="text-[9px] text-center">2022</div></div>
    <div class="absolute opacity-60" style="left:34%;top:11%"><div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-xs">🔒</div><div class="text-[9px] text-center">2023</div></div>
  </main>

  <!-- 底部：回放 / 统计 / 退出 -->
  <footer class="grid grid-cols-3 gap-2 p-3 bg-black/40 text-sm">
    <button class="py-2 rounded-lg bg-white/10">↺ 回放</button>
    <button class="py-2 rounded-lg bg-white/10">📊 统计</button>
    <button class="py-2 rounded-lg bg-white/10">✕ 退出</button>
  </footer>
</body>
</html>
