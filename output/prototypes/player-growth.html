<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动主界面原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen max-w-sm mx-auto flex flex-col"
      style="background:linear-gradient(#3a7d3a,#2e6e2e);">
  <!-- 顶部资源栏 -->
  <header class="flex items-center gap-1 p-2 text-xs bg-black/30">
    <div class="flex items-center gap-1">
      <span class="w-6 h-6 rounded-full bg-amber-400 text-slate-900 font-bold flex items-center justify-center">2</span>
      <div class="w-12 h-2 bg-white/20 rounded"><div class="h-2 bg-sky-400 rounded" style="width:38%"></div></div>
    </div>
    <span class="ml-auto bg-black/30 rounded px-2 py-0.5">💎 1342</span>
    <span class="bg-black/30 rounded px-2 py-0.5">🟡 1342</span>
    <span class="bg-black/30 rounded px-2 py-0.5">⚡ 9/9</span>
    <button class="bg-black/30 rounded px-1.5 py-0.5">⚙️</button>
  </header>

  <!-- 赛季信息 -->
  <div class="text-center text-xs text-white/80 mt-2">2018 第1赛季 · 第13周</div>

  <!-- 中部：左右入口 + 角色立绘 -->
  <main class="flex-1 flex items-stretch px-2 py-3">
    <!-- 左侧入口 -->
    <div class="flex flex-col gap-2 justify-center">
      <button class="w-14 h-14 rounded-xl bg-black/30 flex flex-col items-center justify-center text-[10px] leading-tight">📋<span>每日任务</span></button>
      <button class="w-14 h-14 rounded-xl bg-black/30 flex flex-col items-center justify-center text-[10px] leading-tight">🎁<span>起始礼包</span></button>
      <button class="w-14 h-14 rounded-xl bg-black/30 flex flex-col items-center justify-center text-[10px] leading-tight">🐷<span>存钱罐</span></button>
      <button class="w-14 h-14 rounded-xl bg-black/30 flex flex-col items-center justify-center text-[10px] leading-tight">👕<span>自定义</span></button>
    </div>

    <!-- 角色立绘（待提供图片，先占位） -->
    <div class="flex-1 flex items-center justify-center relative">
      <span class="absolute top-2 left-4 text-xl">👑</span>
      <span class="absolute top-2 right-4 text-xl">🎁</span>
      <img src="../../input/refs/character.png" alt="3D角色立绘位"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'w-28 h-44 rounded-xl bg-white/10 flex items-center justify-center text-white/40 text-xs',innerText:'3D角色立绘位'}))"
           class="h-44">
    </div>

    <!-- 右侧数据/入口 -->
    <div class="flex flex-col gap-2 justify-center text-[10px]">
      <button class="w-14 h-14 rounded-xl bg-black/30 flex flex-col items-center justify-center leading-tight">🎯<span>目标</span></button>
      <div class="w-14 h-12 rounded-xl bg-black/30 flex flex-col items-center justify-center leading-tight">⭐评分<b class="text-amber-300 text-sm">10</b></div>
      <div class="w-14 h-12 rounded-xl bg-black/30 flex flex-col items-center justify-center leading-tight">⚽进球<b class="text-amber-300 text-sm">16</b></div>
      <div class="w-14 h-12 rounded-xl bg-black/30 flex flex-col items-center justify-center leading-tight">🅰️助攻<b class="text-amber-300 text-sm">10</b></div>
      <button class="w-14 h-14 rounded-xl bg-black/30 flex flex-col items-center justify-center leading-tight">🏆<span>职业生涯</span></button>
    </div>
  </main>

  <!-- 下一场比赛 -->
  <div class="px-4 pb-2">
    <button class="w-full py-3 rounded-2xl bg-amber-400 text-slate-900 font-bold text-lg shadow-lg">下一场比赛 ▶</button>
  </div>

  <!-- 底部 Tab -->
  <nav class="grid grid-cols-5 bg-black/40 text-[11px] text-center">
    <button class="py-2 flex flex-col items-center">🛒<span>商店</span></button>
    <button class="py-2 flex flex-col items-center">🏅<span>奖杯</span></button>
    <button class="py-2 flex flex-col items-center text-amber-300">⚽<span>开始</span></button>
    <button class="py-2 flex flex-col items-center relative">📅<span>日历</span><span class="absolute top-1 right-3 w-2 h-2 bg-red-500 rounded-full"></span></button>
    <button class="py-2 flex flex-col items-center relative">📊<span>排名</span><span class="absolute top-1 right-3 w-2 h-2 bg-red-500 rounded-full"></span></button>
  </nav>
</body>
</html>
